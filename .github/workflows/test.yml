name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: denylist (optional, set repository variable LP_DENYLIST)
        env:
          LP_DENYLIST: ${{ vars.LP_DENYLIST }}
        run: python -m unittest tests.test_repo.TestNoIdentifyingInfo -v
      - run: python -m unittest discover -s tests -v
