<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>活软件演示</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header><h1>活软件演示</h1><p>固定页由数据库按公式计算；智能体面板出次抛展示，可申请固化，长成新的固定页。</p></header>
<main>
  <nav aria-label="固定页目录">
    <h2>固定页</h2>
    <ul id="pages"></ul>
    <p id="pages-empty" class="muted" hidden>还没有固定页。先在右侧提问，申请固化后运行 grow.sh。</p>
  </nav>
  <section>
    <form id="ask">
      <label for="q">问智能体</label>
      <div class="row"><input id="q" name="q" placeholder="例如：各地区在途商机金额" autocomplete="off"><button type="submit">提问</button></div>
    </form>
    <p id="route" class="muted"></p>
    <article id="surface" hidden>
      <div class="titlebar"><h2 id="title"></h2><span id="badge" class="badge"></span></div>
      <p id="provenance" class="muted"></p>
      <div id="components"></div>
      <div id="promote-row" hidden><button id="promote" type="button">申请固化</button><span id="promote-msg" class="muted"></span></div>
    </article>
  </section>
</main>
<script src="/app.js"></script>
</body>
</html>
