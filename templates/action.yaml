# 原子行动模板（OLTP 必须完整填写）
action: transfer_opportunity
version: 1.0.0
object: Opportunity
inputs: {opportunity_id: string, to_owner_id: string, reason: string, idempotency_key: string}
preconditions:
  - opportunity.stage in [qualified, proposal]
  - actor.role == region_manager and actor.region == opportunity.region
effects:
  - opportunity.owner_id := to_owner_id
  - insert transfer_history
  - insert outbox_event(type=notify_previous_owner)     # 同一事务
transaction: single
idempotency: unique(idempotency_key)
concurrency: optimistic_lock(opportunity.version)
approval: none   # 或 required_by: <role>
audit: [actor, ts, before, after, reason]
compensation: outbox retry x3 → manual queue
tests: [precondition_fail, no_permission, duplicate_submit, concurrent_update, downstream_fail, audit_written]
